# Colemak home-row nav. Copy to ~/.groket/keys.toml.
# Omitted ids keep catalog defaults (y copy, / search, h/l and Left/Right
# turns). Left/Right are not letters. Next-turn is not remapped to i
# (Colemak physical L) so i stays free.
leader = ";"
leader_timeout_ms = 800

[home]
"list.down" = "n"
"list.up" = "e"
"session.follow" = "leader+n"
"session.done" = "leader+e"

[browser]
"list.down" = "n"
"list.up" = "e"
"session.follow" = "leader+n"
"session.done" = "leader+e"
